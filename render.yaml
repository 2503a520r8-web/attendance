services:
  - type: web
    name: attendsmart-campus
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: STAFF_INVITE_CODE
        generateValue: true
      - key: CORS_ORIGIN
        value: ''
      - key: CAMPUS_LAT
        sync: false
      - key: CAMPUS_LNG
        sync: false
      - key: CAMPUS_RADIUS_METERS
        value: '250'
